<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Tab</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" type="image/svg" href="icons/icon16.svg" media="(prefers-color-scheme: light)">
    <link rel="icon" type="image/svg" href="icons/dark_icon16.svg" media="(prefers-color-scheme: dark)">
</head>
<body>
    <div class="container">
        <div class="time-container" id="time-display" style="display: none;"></div>
        <div class="logo-container">
            <img src="https://www.google.com/images/branding/googlelogo/2x/googlelogo_color_272x92dp.png" alt="Logo" id="search-logo">
        </div>
        <div class="search-container">
            <div class="search-box">
                <div class="search-icon">
                    <svg focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"></path></svg>
                </div>
                <input type="text" id="search-input" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="search" lang="zh-CN" placeholder="在 Google 上搜索，或者输入一个网址">
                <div class="search-engine-switcher">
                    <button id="switcher-btn" title="切换搜索引擎">
                        <img id="current-engine-icon" src="" alt="Engine">
                    </button>
                    <div class="engine-menu" id="engine-menu">
                        <!-- 搜索引擎列表将通过 JS 动态生成 -->
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="settings-icon" id="settings-btn" title="设置背景">
        <svg xmlns="http://www.w3.org/2000/svg" height="24" viewBox="0 0 24 24" width="24"><path d="M0 0h24v24H0z" fill="none"/><path d="M19.43 12.98c.04-.32.07-.64.07-.98s-.03-.66-.07-.98l2.11-1.65c.19-.15.24-.42.12-.64l-2-3.46c-.12-.22-.39-.3-.61-.22l-2.49 1c-.52-.4-1.08-.73-1.69-.98l-.38-2.65C14.46 2.18 14.25 2 14 2h-4c-.25 0-.46.18-.49.42l-.38 2.65c-.61.25-1.17.59-1.69.98l-2.49-1c-.23-.09-.49 0-.61.22l-2 3.46c-.13.22-.07.49.12.64l2.11 1.65c-.04.32-.07.65-.07.98s.03.66.07.98l-2.11 1.65c-.19.15-.24.42-.12.64l2 3.46c.12.22.39.3.61.22l2.49-1c.52.4 1.08.73 1.69.98l.38 2.65c.03.24.24.42.49.42h4c.25 0 .46-.18.49-.42l.38-2.65c.61-.25 1.17-.59 1.69-.98l2.49 1c.23.09.49 0 .61-.22l2-3.46c.12-.22.07-.49-.12-.64l-2.11-1.65zM12 15.5c-1.93 0-3.5-1.57-3.5-3.5s1.57-3.5 3.5-3.5 3.5 1.57 3.5 3.5-1.57 3.5-3.5 3.5z" fill="#5f6368"/></svg>
    </div>
    <div class="clear-bg-icon" id="clear-bg-btn" title="清除背景" style="display: none;">
        <svg xmlns="http://www.w3.org/2000/svg" height="24" viewBox="0 0 24 24" width="24"><path d="M0 0h24v24H0z" fill="none"/><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z" fill="#5f6368"/></svg>
    </div>
    <input type="file" id="bg-upload" accept="image/*" style="display: none;">

    <!-- 设置面板 -->
    <div id="settings-panel" class="settings-panel">
        <div class="settings-content">
            <div class="settings-header">
                <h2>设置</h2>
                <button id="close-settings-btn" class="close-btn">
                    <svg xmlns="http://www.w3.org/2000/svg" height="24" viewBox="0 0 24 24" width="24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
                </button>
            </div>

            <div class="settings-body">
                <!-- 颜色设置 -->
                <div class="settings-section">
                    <h3>颜色</h3>
                    <div class="color-group">
                        <label>
                            <span>背景颜色</span>
                            <div class="color-input-wrapper">
                                <input type="color" id="bg-color" value="#ffffff">
                                <input type="text" id="bg-color-text" class="color-text" value="#ffffff">
                            </div>
                        </label>
                        <label>
                            <span>文字颜色</span>
                            <div class="color-input-wrapper">
                                <input type="color" id="text-color" value="#202124">
                                <input type="text" id="text-color-text" class="color-text" value="#202124">
                            </div>
                        </label>
                        <label>
                            <span>搜索框背景</span>
                            <div class="color-input-wrapper">
                                <input type="color" id="search-bg-color" value="#ffffff">
                                <input type="text" id="search-bg-color-text" class="color-text" value="#ffffff">
                            </div>
                        </label>
                        <label>
                            <span>搜索框边框</span>
                            <div class="color-input-wrapper">
                                <input type="color" id="search-border-color" value="#dfe1e5">
                                <input type="text" id="search-border-color-text" class="color-text" value="#dfe1e5">
                            </div>
                        </label>
                        <label>
                            <span>搜索框悬停边框</span>
                            <div class="color-input-wrapper">
                                <input type="color" id="search-border-hover-color" value="#dfe1e5">
                                <input type="text" id="search-border-hover-color-text" class="color-text" value="#dfe1e5">
                            </div>
                        </label>
                        <label>
                            <span>搜索框阴影</span>
                            <div class="color-input-wrapper">
                                <input type="color" id="search-shadow-color" value="#000000">
                                <input type="text" id="search-shadow-color-text" class="color-text" value="#000000">
                            </div>
                        </label>
                        <label>
                            <span>按钮背景</span>
                            <div class="color-input-wrapper">
                                <input type="color" id="btn-bg-color" value="#ffffff">
                                <input type="text" id="btn-bg-color-text" class="color-text" value="#ffffff">
                            </div>
                        </label>
                        <label>
                            <span>图标颜色</span>
                            <div class="color-input-wrapper">
                                <input type="color" id="icon-color" value="#9aa0a6">
                                <input type="text" id="icon-color-text" class="color-text" value="#9aa0a6">
                            </div>
                        </label>
                    </div>
                </div>

                <!-- 搜索框设置 -->
                <div class="settings-section">
                    <h3>搜索框</h3>
                    <div class="slider-group">
                        <label>
                            <span>搜索框宽度: <b id="search-width-value">100%</b></span>
                            <input type="range" id="search-width" min="50" max="100" value="100">
                        </label>
                        <label>
                            <span>搜索框高度: <b id="search-height-value">64px</b></span>
                            <input type="range" id="search-height" min="40" max="100" value="64">
                        </label>
                        <label>
                            <span>搜索框圆角: <b id="search-radius-value">30px</b></span>
                            <input type="range" id="search-radius" min="0" max="50" value="30">
                        </label>
                        <label>
                            <span>搜索框上边距: <b id="search-margin-top-value">0px</b></span>
                            <input type="range" id="search-margin-top" min="-200" max="200" value="0">
                        </label>
                    </div>
                </div>

                <!-- Logo 设置 -->
                <div class="settings-section">
                    <h3>Logo</h3>
                    <div class="slider-group">
                        <label>
                            <span>Logo 高度: <b id="logo-height-value">110px</b></span>
                            <input type="range" id="logo-height" min="50" max="200" value="110">
                        </label>
                        <label>
                            <span>Logo 下边距: <b id="logo-margin-value">38px</b></span>
                            <input type="range" id="logo-margin" min="0" max="100" value="38">
                        </label>
                    </div>
                </div>

                <!-- 透明度设置 -->
                <div class="settings-section">
                    <h3>透明度</h3>
                    <div class="slider-group">
                        <label>
                            <span>背景透明度: <b id="bg-opacity-value">100%</b></span>
                            <input type="range" id="bg-opacity" min="0" max="100" value="100">
                        </label>
                    </div>
                </div>

                <!-- 打开方式设置 -->
                <div class="settings-section">
                    <h3>打开方式</h3>
                    <div class="radio-group">
                        <label class="radio-label">
                            <input type="radio" name="open-target" id="open-current" value="current">
                            <span>在当前标签页打开</span>
                        </label>
                        <label class="radio-label">
                            <input type="radio" name="open-target" id="open-new" value="new" checked>
                            <span>在新标签页打开</span>
                        </label>
                    </div>
                </div>

                <!-- 搜索行为设置 -->
                <div class="settings-section">
                    <h3>搜索行为</h3>
                    <div class="checkbox-group">
                        <label class="checkbox-label">
                            <input type="checkbox" id="clear-search-newtab">
                            <span>在新标签页打开时清空搜索框</span>
                        </label>
                    </div>
                </div>

                <!-- 操作按钮 -->
                <div class="settings-actions">
                    <button id="reset-settings-btn" class="reset-btn">恢复默认</button>
                    <button id="save-settings-btn" class="save-btn">保存</button>
                </div>
            </div>
        </div>
    </div>

    <script src="js/script.js"></script>
</body>
</html>
